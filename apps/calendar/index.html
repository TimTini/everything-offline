    <!-- Booking links read `calendar.puter.com/#/<host>/<page>` (see linkFor in
         src/js/booking.js). They land on the app shell but belong to the guest
         booking page, public/book.html — no sign-in, no SDK, none of the app —
         so hand them over here, before anything else loads; `replace`, so Back
         never returns to a page that only ever forwarded. The grammar is
         exact: the label of a `cal-<host>.puter.work` worker and a page slug —
         lowercase letters, digits, hyphens, nothing else — so this can only
         ever forward to the sibling booking page, never anywhere a crafted
         link might point. Lowercased first: these links get read out and
         retyped, hostnames are case-insensitive, and page ids are stored
         lowercase. Any other hash (or an exception here) leaves the calendar
         to boot as usual. Checked again on every hashchange: a booking link
         pasted into a tab that already shows the calendar changes only the
         fragment — a same-document navigation, which reloads nothing — and
         would otherwise be silently ignored. Kept in step with the same test
         in src/js/booking.js and public/book.html. -->
    <script>
      (function () {
        function forward() {
          try {
            var m = /^#\/([a-z0-9][a-z0-9-]{0,58})\/([a-z0-9][a-z0-9-]{2,30}[a-z0-9])$/.exec(
              String(location.hash).toLowerCase(),
            );
            if (m) location.replace('book.html#/' + m[1] + '/' + m[2]);
          } catch (_e) {
            /* not a booking route we can act on — boot the calendar */
          }
        }
        forward();
        try {
          addEventListener('hashchange', forward);
        } catch (_e) {
          /* the load-time check above still ran */
        }
      })();
    </script>
